name: Admin data
# Collects workflow and repo status every 15 minutes and commits data/. Each run loops ~5.6 h, then dispatches the
# next one (GitHub delays scheduled runs by hours); the schedule is a backstop. Disable the workflow to stop it.
on:
  schedule: [{ cron: '23 */3 * * *' }]
  workflow_dispatch:
permissions: { contents: write, actions: write }
concurrency: { group: admin-data, cancel-in-progress: false }
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Collect every 15 minutes
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          git config user.name "admin-bot" && git config user.email "admin-bot@users.noreply.github.com"
          end=$((SECONDS + 20100))
          while [ $SECONDS -lt $end ]; do
            git pull -q --rebase || true
            node scripts/collect.mjs || true
            git add data && git commit -qm "Admin data $(date -u +%H:%MZ) [skip ci]" && (git push -q || (git pull -q --rebase && git push -q)) || true
            sleep 900
          done
      - name: Hand over to the next run
        if: ${{ !cancelled() }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/collect.yml/dispatches" -d '{"ref":"main"}'
